name: mobile-ci

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yaml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yaml"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: Prettier
        run: npx prettier --check .

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Jest
        run: npx jest --ci

      - name: Expo Doctor
        run: npx expo-doctor
