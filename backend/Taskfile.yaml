version: "3"

tasks:
  install:
    desc: uv sync で依存をロックファイルどおりに取得する
    cmds:
      - uv sync --frozen

  lint:
    desc: Ruff で lint を実行する
    cmds:
      - uv run ruff check

  lint:fix:
    desc: Ruff で自動修正可能な lint 違反を直す
    cmds:
      - uv run ruff check --fix

  format:
    desc: Ruff format でコードを整形する
    cmds:
      - uv run ruff format

  format:check:
    desc: 整形差分が無いかを確認する（CI 用）
    cmds:
      - uv run ruff format --check

  typecheck:
    desc: ty で型チェックを実行する
    cmds:
      - uv run ty check

  lint:imports:
    desc: import-linter で層境界（クリーンアーキテクチャの依存方向）を検査する
    cmds:
      - uv run python -c 'from importlinter.cli import lint_imports_command; lint_imports_command()'

  test:
    desc: pytest を実行する
    cmds:
      - uv run python -m pytest

  dev:
    desc: 開発用 FastAPI サーバを起動する（http://localhost:8000）
    cmds:
      - uv run python -m uvicorn src.main:app --reload

  dev:device:
    desc: 実機確認用に LAN 向け FastAPI サーバを起動する（http://0.0.0.0:8080）
    cmds:
      - uv run python -m uvicorn src.main:app --reload --host 0.0.0.0 --port 8080

  db:up:
    desc: Docker Compose でローカル PostgreSQL を起動する
    cmds:
      - docker compose up -d db

  db:down:
    desc: Docker Compose のローカル PostgreSQL を停止する
    cmds:
      - docker compose down

  db:logs:
    desc: Docker Compose の PostgreSQL ログを表示する
    cmds:
      - docker compose logs -f db

  db:current:
    desc: 適用中の Alembic リビジョンを表示する（DB 接続が必要）
    cmds:
      - uv run python -m alembic current

  db:heads:
    desc: ローカルにある Alembic の HEAD リビジョンを表示する
    cmds:
      - uv run python -m alembic heads

  db:revision:
    desc: 'Alembic マイグレーションを生成する。例: task backend:db:revision -- "add users"'
    cmds:
      - uv run python -m alembic revision -m "{{.CLI_ARGS}}"

  db:upgrade:
    desc: マイグレーションを HEAD まで適用する
    cmds:
      - uv run python -m alembic upgrade head

  db:downgrade:
    desc: 1 つ前のリビジョンへロールバックする
    cmds:
      - uv run python -m alembic downgrade -1

  docker:build:
    desc: Cloud Run 向け Docker イメージをビルドする
    cmds:
      - docker build -t hourglass-backend .

  ci:
    desc: CI 相当のチェック（lint / format:check / lint:imports / typecheck / test）を一括実行する
    cmds:
      - task: lint
      - task: format:check
      - task: lint:imports
      - task: typecheck
      - task: test
